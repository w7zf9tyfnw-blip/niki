<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>手账工坊 · 一张照片，一段想法，一页手账</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <div class="logo">✦</div>
      <div>
        <h1>手账工坊</h1>
        <p>照片 + 一句话，自动排成一页</p>
      </div>
    </header>

    <section class="field">
      <div class="label"><span>01 照片</span><button class="ghost" id="sampleBtn" type="button">用示例</button></div>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*" hidden />
        <img id="thumb" alt="" hidden />
        <div class="drop-inner" id="dropHint">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15l4.5-4.5L12 15l3-3 6 6"/><circle cx="8.5" cy="9" r="1.4"/>
          </svg>
          <span>点击或拖入照片</span>
        </div>
      </label>
    </section>

    <section class="field">
      <div class="label">
        <span>02 想法</span>
        <button class="mic" id="mic" type="button" title="按住说话（Chrome / Edge）">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
          <span id="micText">说两句</span>
        </button>
      </div>
      <textarea id="text" placeholder="随口说：今天逛到一家很酷的复古衣服店，叫 basickin，他家是卖复古衣服的，版型很好看，逛得好开心…"></textarea>
      <div class="hint" id="interim"></div>
      <div class="parse" id="parse" hidden>
        <div class="prow"><b>标签</b><span id="pTag">—</span></div>
        <div class="prow"><b>介绍</b><span id="pIntro">—</span></div>
        <div class="prow"><b>感受</b><span id="pFeel">—</span></div>
      </div>
    </section>

    <section class="field">
      <div class="label">
        <span>03 背景色</span>
        <span class="label-actions">
          <button class="ghost" id="autoBtn" type="button">跟随照片</button>
          <button class="ghost" id="textBtn" type="button">跟随文字</button>
        </span>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="row">
        <label class="color-wrap" title="自定义颜色">
          <input type="color" id="color" value="#16161b" />
          <span>自定义</span>
        </label>
        <span class="hint" id="paletteHint">纯色底，可随时换</span>
      </div>
    </section>

    <section class="field">
      <div class="label"><span>04 版式</span></div>
      <div class="seg" id="styles">
        <button data-v="card" class="on">照片卡片</button>
        <button data-v="polaroid">拍立得</button>
        <button data-v="cutout">抠图贴纸</button>
        <button data-v="sticker">菜单贴纸</button>
        <button data-v="none">只要文字</button>
      </div>
      <div class="seg small" id="decor">
        <button data-v="minimal">极简</button>
        <button data-v="medium" class="on">手账</button>
        <button data-v="rich">多贴一点</button>
      </div>
      <div class="seg small" id="ratio">
        <button data-v="3:4">3:4</button>
        <button data-v="2:3" class="on">2:3</button>
        <button data-v="1:1">1:1</button>
        <button data-v="9:16">9:16</button>
      </div>
      <div class="label sub"><span>贴纸</span><button class="ghost" id="stickerHint" type="button">放进 assets/stickers/</button></div>
      <div class="sticker-row" id="stickerRow"></div>


      <div class="label sub"><span>标签样式</span></div>
      <div class="seg small" id="tagStyle">
        <button data-v="sticky" class="on">便利贴</button>
        <button data-v="hand">手写</button>
        <button data-v="tape">胶带</button>
        <button data-v="none">不显示</button>
      </div>
      <div class="label sub"><span>排版</span></div>
      <div class="seg small" id="layout">
        <button data-v="auto" class="on">自动</button>
        <button data-v="center">居中</button>
        <button data-v="corner">四角</button>
        <button data-v="split">分栏</button>
      </div>
      <div class="label sub"><span>手写字形</span></div>
      <div class="seg fonts" id="fonts">
        <button data-v="lemi" class="on">蜡笔</button>
      </div>
      <div class="toggle-row">
        <span>手绘简笔画</span>
        <button class="switch on" id="doodleBtn" type="button" aria-pressed="true"><i></i></button>
      </div>
      <div class="toggle-row">
        <span>表情符号</span>
        <button class="switch on" id="emojiBtn" type="button" aria-pressed="true"><i></i></button>
      </div>
      <div class="tol" id="tolWrap" hidden>
        <label>抠图容差 <b id="tolVal">30</b></label>
        <input type="range" id="tol" min="8" max="70" value="30" />
        <div class="tol-actions">
          <button class="ghost" id="openMask" type="button">修一下边缘 →</button>
          <label class="chk"><input type="checkbox" id="forceBtn" /> 不干净也照用</label>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="primary" id="go" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>
        </svg>
        生成手账
      </button>
      <button class="secondary" id="dl" type="button" disabled>下载 PNG</button>
    </div>

    <div class="phone" id="phoneHint" hidden>
      <span>手机同一 Wi-Fi 打开</span>
      <code id="phoneUrl"></code>
    </div>
  </aside>

  <main class="stage">
    <div class="paper" id="paper">
      <div class="placeholder" id="placeholder">
        <div class="ph-mark">✧</div>
        <p>左边放一张照片，说两句话<br/>这里就会长出一页手账</p>
      </div>
      <div class="page-wrap" id="pageWrap" hidden>
        <img id="preview" alt="手账预览" />
        <div class="stk-layer" id="stkLayer"></div>
      </div>
      <div class="loading" id="loading" hidden><span></span>正在排版…</div>
    </div>
    <div class="stk-bar" id="stkBar" hidden>
      <span id="stkHint">拖动贴纸调整位置</span>
      <label class="mk-size">大小 <input type="range" id="stkSize" min="6" max="40" value="13" /><b id="stkSizeVal">13</b></label>
      <label class="mk-size">角度 <input type="range" id="stkRot" min="-180" max="180" value="0" /><b id="stkRotVal">0</b></label>
      <button class="secondary" id="stkClear" type="button">清空贴纸</button>
    </div>
    <div class="meta" id="meta"></div>
  </main>
</div>

<div class="mk" id="mk" hidden>
  <div class="mk-box">
    <div class="mk-head">
      <b>修一下边缘</b>
      <span>涂掉多余的背景，或者把被误删的主体补回来</span>
      <button id="mkClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="mk-stage"><canvas id="mkCanvas"></canvas></div>
    <div class="mk-foot">
      <div class="seg small" id="mkTools">
        <button data-v="erase" class="on" type="button">擦掉</button>
        <button data-v="restore" type="button">补回</button>
      </div>
      <label class="mk-size">笔刷 <input type="range" id="mkBrush" min="6" max="90" value="26" /><b id="mkBrushVal">26</b></label>
      <button class="secondary" id="mkReset" type="button">重置</button>
      <button class="primary" id="mkApply" type="button">应用</button>
    </div>
    <div class="mk-tip" id="mkTip"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="boot" id="boot">
  <div class="boot-card">
    <div class="boot-mark">✦</div>
    <h2>正在准备手账工坊</h2>
    <p id="bootText">首次打开需要下载运行时（约 25MB），之后会缓存</p>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <button class="boot-retry" id="bootRetry" type="button" hidden>重试</button>
    <p class="boot-tip">纯本地运行 · 照片不会离开这台设备</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script src="stickers-manifest.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
